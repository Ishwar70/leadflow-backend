name: Seed demo data

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run seed
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: seed-only-placeholder-secret-not-used
